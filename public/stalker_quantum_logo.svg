<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background subtle dark container gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Luxury Crimson Prism Gradient -->
    <linearGradient id="crimsonLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e56" />
      <stop offset="50%" stop-color="#e60039" />
      <stop offset="100%" stop-color="#80001a" />
    </linearGradient>

    <!-- Quantum Cyan Stream Gradient -->
    <linearGradient id="cyanLaser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>

    <!-- Chrome Titanium Gradient for Body -->
    <linearGradient id="titaniumMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d4d4d8" />
      <stop offset="50%" stop-color="#71717a" />
      <stop offset="75%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Glowing Core Radial Gradient -->
    <radialGradient id="quantumCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ff2a6d" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#05d9e8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ultra High-End Multi-Layer Glow Filters -->
    <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO ICON MARK (Quantum Infinity Streaming Prism) -->
  <g transform="translate(40, 20)">
    <!-- Outer Ambient Energy Ring -->
    <ellipse cx="100" cy="100" rx="90" ry="90" fill="none" stroke="url(#cyanLaser)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
    
    <!-- Quantum Orbit Alpha (Crimson Flux) -->
    <ellipse cx="100" cy="100" rx="82" ry="34" fill="none" stroke="url(#crimsonLaser)" stroke-width="4.5" transform="rotate(-32 100 100)" filter="url(#softGlow)" stroke-linecap="round" />
    
    <!-- Quantum Orbit Beta (Electric Cyan Stream) -->
    <ellipse cx="100" cy="100" rx="82" ry="34" fill="none" stroke="url(#cyanLaser)" stroke-width="4.5" transform="rotate(32 100 100)" filter="url(#softGlow)" stroke-linecap="round" />
    
    <!-- Orbital Nodes (Energy Photons) -->
    <circle cx="35" cy="65" r="4.5" fill="#00f5d4" filter="url(#ultraGlow)" />
    <circle cx="165" cy="135" r="4.5" fill="#00f5d4" filter="url(#ultraGlow)" />
    <circle cx="160" cy="62" r="5" fill="#ff1e56" filter="url(#ultraGlow)" />
    <circle cx="40" cy="138" r="5" fill="#ff1e56" filter="url(#ultraGlow)" />

    <!-- Center Play/Signal Quantum Singularity Prism -->
    <g transform="translate(100, 100)">
      <!-- Background Core Bloom -->
      <circle cx="0" cy="0" r="42" fill="url(#quantumCoreGlow)" />
      
      <!-- Precision Hexagonal Shield Frame -->
      <polygon points="0,-36 31.18,-18 31.18,18 0,36 -31.18,18 -31.18,-18" fill="#0c1017" stroke="url(#titaniumMetal)" stroke-width="2" />
      
      <!-- Inner Dynamic Streaming Play Arrow -->
      <path d="M-9,-18 L18,0 L-9,18 Z" fill="url(#crimsonLaser)" filter="url(#softGlow)" />
      <path d="M-9,-18 L18,0 L-3,0 L-9,18 Z" fill="#ffffff" opacity="0.3" />
      
      <!-- Central Quantum Spark -->
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#ultraGlow)" />
    </g>
  </g>

  <!-- LUXURY TYPOGRAPHY -->
  <g transform="translate(260, 85)">
    <!-- Primary Brand Wordmark: STALKER -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#titaniumMetal)">
      STALKER
    </text>
    
    <!-- PRO Pill Badge -->
    <g transform="translate(260, 8)">
      <rect x="0" y="0" width="105" height="42" rx="12" fill="url(#crimsonLaser)" filter="url(#softGlow)" />
      <rect x="1" y="1" width="103" height="40" rx="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
      <text x="52.5" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        PRO
      </text>
    </g>

    <!-- Subtitle: Elegant, Non-Tacky -->
    <text x="3" y="80" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="8" fill="#71717a">
      NEXT-GEN STREAMING SUITE
    </text>
  </g>
</svg>
